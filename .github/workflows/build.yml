name: Build Android APK

on:
  push:
    branches: [ main, noor-agro-system-patch-1 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential openjdk-17-jdk git autoconf libtool pkg-config zlib1g-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agro-app-apk
          path: bin/*.apk
